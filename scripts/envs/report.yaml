# Referenz/Dokumentation -- scripts/setup_envs.sh legt dieses Env tatsächlich
# per `mamba create` (nicht `env create -f`) an, Paketliste dort synchron halten.
name: nanopore-report
channels:
  - conda-forge
  - nodefaults   # verhindert Konflikte, wenn "defaults" global konfiguriert ist (z.B. auf PALMA)
dependencies:
  - python=3.11
  - reportlab
  - python-docx
