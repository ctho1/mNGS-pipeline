name: nanopore-ichorcna
# Referenz/Dokumentation -- scripts/setup_envs.sh legt dieses Env tatsächlich
# per `mamba create` (nicht `env create -f`) an, Paketliste dort synchron halten.
# Kein osx-arm64-Build vorhanden (bioconda liefert r-ichorcna nur für
# linux-64/osx-64) -- dieses Env wird von setup_envs.sh explizit mit
# CONDA_SUBDIR=osx-64 angelegt und läuft auf Apple Silicon unter Rosetta 2.
channels:
  - bioconda
  - conda-forge
  - nodefaults   # verhindert Konflikte, wenn "defaults" global konfiguriert ist (z.B. auf PALMA)
dependencies:
  - r-base=4.3
  - r-ichorcna=0.5.1
  - r-optparse
