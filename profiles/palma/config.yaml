# SLURM-Profil für PALMA (Uni Münster). Feintuning (Partition, Zeitlimits,
# Account) bei Bedarf anpassen -- Defaults orientieren sich an den im
# ursprünglichen krakenuniq-report/run_pipeline.sh verwendeten Werten
# (Partition requeue, 36 Cores, 140G RAM).
#
# Voraussetzung im snakemake-Env: pip install snakemake-executor-plugin-slurm
#
# KrakenUniq-Pfade (DB, module_prefix) sind bereits in config/config.yaml als
# Default gesetzt (unverändert aus dem ursprünglichen config.sh) -- hier i.d.R.
# keine Overrides nötig, es sei denn Account/Pfade weichen ab:
#   snakemake --profile profiles/palma --config 'krakenuniq={"db": "/anderer/pfad"}'
executor: slurm
jobs: 20
printshellcmds: true
rerun-incomplete: true
default-resources:
  slurm_partition: "requeue"
  runtime: 60
  mem_mb: 143360
  cpus_per_task: 36
